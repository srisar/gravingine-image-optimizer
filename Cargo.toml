[package]
name = "gravingine_image_optimizer"
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/srisar/gravingine-image-optimizer"

[dependencies]
anyhow = "1.0.104"
avif-decode = { version = "3.0.0", default-features = false }
crc32fast = "1.5.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
imgref = "1.12.3"
moxcms = "0.8.1"
mozjpeg = "0.10.13"
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
ravif = "0.13.0"
rayon = "1.12.0"
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images", "svgz"] }
rfd = "0.16"
rgb = "0.8.53"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.19.0", features = ["unstable-winit-030"] }
walkdir = "2.5.0"
webp = "0.3.1"
winapi = { version = "0.3.9", features = ["winuser", "wingdi", "windef", "minwindef", "dwmapi", "shobjidl_core", "combaseapi", "objbase", "unknwnbase", "winerror", "wtypesbase", "synchapi", "errhandlingapi", "namedpipeapi", "winbase", "fileapi", "handleapi", "processthreadsapi", "winnt"] }

[build-dependencies]
embed-resource = "3.0.9"
slint-build = "1.19.0"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[features]
# Self-snapshots (GIO_SNAPSHOT=...) in release builds too, for checking the shipped build.
snapshot = []
