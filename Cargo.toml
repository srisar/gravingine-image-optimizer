[package]
name = "gravingine_image_optimizer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
imgref = "1.12.3"
mozjpeg = "0.10.13"
native-windows-gui = { version = "1.0.13", default-features = false, features = ["file-dialog", "progress-bar", "list-view", "combobox", "trackbar", "notice", "high-dpi", "textbox", "tooltip", "frame"] }
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
ravif = "0.13.0"
rayon = "1.12.0"
rgb = "0.8.53"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
webp = "0.3.1"
winapi = { version = "0.3.9", features = ["winuser", "wingdi", "uxtheme", "windef", "minwindef", "commctrl", "dwmapi", "shobjidl_core", "combaseapi", "objbase", "ole2", "oleidl", "objidl", "unknwnbase", "shellapi", "winerror", "winreg", "libloaderapi", "wtypes", "minwinbase", "winbase", "sysinfoapi"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[features]
# Self-snapshots (GIO_SNAPSHOT=...) in release builds too, for checking the shipped build.
snapshot = []
