# Publish a GitHub release when a version tag is pushed:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# The tag must match the version in Cargo.toml. The release gets the Windows installer and
# the portable zip from scripts/build-release.sh, their SHA-256 checksums, and notes generated
# from the merged pull requests.
#
# Actions are pinned to full commit SHAs (tag in the comment). Only the publish job can
# write to the repository, and it runs no third-party actions.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match Cargo.toml version ${version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # Assembly for the JPEG and AVIF encoders (faster encoding).
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Inno Setup 6 for the installer (preinstalled on most Windows runner images).
      - name: Make sure Inno Setup is installed
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && ! command -v iscc >/dev/null; then
            choco install innosetup --yes --no-progress
          fi

      - name: Test, build and package
        run: scripts/build-release.sh --require-installer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.exe dist/*.zip dist/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Gravingine Image Optimizer ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
